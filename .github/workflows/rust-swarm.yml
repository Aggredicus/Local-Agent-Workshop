name: Rust Swarm

on:
  pull_request:
    paths:
      - 'rust/law-swarm/**'
      - '.github/workflows/rust-swarm.yml'
  push:
    branches:
      - main
      - 'agent/**'
    paths:
      - 'rust/law-swarm/**'
      - '.github/workflows/rust-swarm.yml'

permissions:
  contents: read

jobs:
  rust-swarm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cargo metadata
        run: cargo metadata --no-deps --manifest-path rust/law-swarm/Cargo.toml
      - name: Format source in CI workspace
        run: cargo fmt --manifest-path rust/law-swarm/Cargo.toml --all
      - name: Test original Rust swarm
        run: cargo test --manifest-path rust/law-swarm/Cargo.toml --all-targets
      - name: Clippy review
        run: cargo clippy --manifest-path rust/law-swarm/Cargo.toml --all-targets -- -D warnings
