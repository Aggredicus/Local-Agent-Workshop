name: Diagnose ISO VM progress
on:
  push:
    branches: ['agent/iso-*']
    paths: ['.github/workflows/iso-diagnostic.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends debian-keyring xorriso qemu-system-x86 qemu-utils ovmf
      - name: Build and inspect the first three minutes of the disposable installer
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          python3 -m workshop.iso.build --output "$RUNNER_TEMP/diagnostic"
          python3 - <<'PY'
          import importlib.util,sys,os
          from pathlib import Path
          spec=importlib.util.spec_from_file_location('qa','scripts/test_law_iso_vm.py')
          qa=importlib.util.module_from_spec(spec); spec.loader.exec_module(qa)
          original=qa.vm
          def bounded(command,log,timeout,*args,**kwargs):
              return original(command,log,min(timeout,180),*args,**kwargs)
          qa.vm=bounded
          sys.argv=['qa',os.environ['RUNNER_TEMP']+'/diagnostic']
          try:
              qa.main()
          finally:
              root=Path(os.environ['RUNNER_TEMP'])/'diagnostic/qa-private-do-not-upload'
              for name in ('install.log','first-boot.log','efi.log'):
                  p=root/name
                  if p.exists():
                      text=p.read_text(errors='replace')[-2800:].replace('%','%25').replace('\r','%0D').replace('\n','%0A')
                      print('::error::Diagnostic '+name+': '+text)
          PY
