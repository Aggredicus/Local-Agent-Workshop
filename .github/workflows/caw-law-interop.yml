name: CAW-LAW contract compatibility

on:
  pull_request:
  push:
    branches:
      - main
      - 'agent/**'

permissions:
  contents: read

jobs:
  validate-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout LAW
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: local-agent-workshop
      - name: Checkout pinned CAW contract and fixture
        uses: actions/checkout@v4
        with:
          repository: Aggredicus/Codex-Agent-Workshop
          ref: 121e21841a8284716db59fca4cdc8ad224af30a1
          persist-credentials: false
          path: codex-agent-workshop
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate actual shared v1 contract
        run: |
          cd local-agent-workshop
          python scripts/work_packet.py validate \
            --schema ../codex-agent-workshop/contracts/caw-law-work-packet.v1.json \
            --packet ../codex-agent-workshop/contracts/fixtures/caw-law-work-packet.example.json
          python scripts/work_packet.py plan \
            --schema ../codex-agent-workshop/contracts/caw-law-work-packet.v1.json \
            --packet ../codex-agent-workshop/contracts/fixtures/caw-law-work-packet.example.json > /tmp/law-plan.json
          python - <<'PY'
          import json
          p = json.load(open('/tmp/law-plan.json'))
          assert p['execution_enabled'] is False
          assert p['network'] == 'deny'
          assert p['host_credentials'] == 'deny'
          assert p['workspace_write'] == 'deny-until-trusted-runner'
          PY
      - name: Exercise LAW agent-version reassessment using the canonical CAW skills
        run: |
          cd local-agent-workshop
          PYTHONPATH=src python - <<'PY'
          import json
          import tempfile
          from pathlib import Path
          from workshop.local_registry import LocalRegistry
          taxonomy = json.loads(Path('../codex-agent-workshop/skill-inventory/taxonomy.json').read_text())
          known = {item['id'] for item in taxonomy['categories']}
          assert 'agent-orchestration' in known
          with tempfile.TemporaryDirectory() as temp:
              with LocalRegistry(Path(temp) / 'private' / 'nodes.sqlite3') as store:
                  human = store.enroll('human')
                  computer = store.enroll('computer')
                  agent = store.enroll('agent', operator_id=human,computer_id=computer,
                      source='codex',version='v1',digest='sha256:' + 'a' * 64)
                  store.capabilities(agent,['agent-orchestration'],known=known)
                  store.propose(agent,'agent-orchestration','pr.propose',known=known)
                  assert store.summary()['outstanding_proposals'] == 1
                  changed = store.upgrade(agent, source='codex',version='v2',
                                          digest='sha256:'+'b'*64)
                  assert changed['reassessment_required'] is True
                  assert store.summary()['outstanding_proposals'] == 0
                  assert store.authorize(agent, 'pr.merge') is False
          PY
