name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop
      - experimental
      - 'agent/**'
      - 'release/**'
      - 'rc/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Run local verification
        run: bash scripts/verify.sh
