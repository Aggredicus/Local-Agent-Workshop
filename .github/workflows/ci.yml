name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - experimental
      - 'agent/**'
      - 'release/**'
      - 'rc/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-tools:
    uses: ./.github/workflows/windows-usb-tests.yml

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and development dependencies
        run: |
          python -m pip install --upgrade 'pip==26.3'
          python -m pip install 'pytest==9.2.0' -e '.[dev]'
      - name: Check CLI entrypoint
        run: workshop --version
      - name: Validate and materialize Agent Skills
        run: |
          workshop skills validate
          workshop skills sync --target /tmp/local-agent-workshop-skills
          workshop skills --root /tmp/local-agent-workshop-skills validate --strict
      - name: Run local verification
        run: bash scripts/verify.sh --quiet
