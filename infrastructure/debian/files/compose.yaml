name: law-smoke
services:
  sentinel:
    image: busybox:1.37.0
    container_name: law-sentinel
    user: "65534:65534"
    command: ["httpd", "-f", "-p", "8080", "-h", "/www"]
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:8088:8080"
    volumes:
      - ./web:/www:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
